<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Launcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body {
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      font-family: 'Montserrat', sans-serif;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 40px,
          rgba(0, 255, 204, 0.1) 40px,
          rgba(0, 255, 204, 0.1) 42px,
          transparent 42px,
          transparent 80px
        ),
        radial-gradient(
          circle at center,
          rgba(0, 255, 204, 0.05),
          transparent 70%
        );
      opacity: 0.6;
      z-index: 0;
    }

    .panic-button {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 24px;
      font-size: 14px;
      color: #fff;
      background: #000;
      border: 2px solid;
      border-image: linear-gradient(45deg, #00ffcc, #ff00ff) 1;
      border-radius: 5px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.3s;
      z-index: 1001;
    }

    .panic-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 0 10px #00ffcc, 0 0 15px #ff00ff;
    }

    .selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    .selection-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .content-wrapper {
      background: rgba(0, 0, 0, 0.9);
      padding: 60px 90px;
      border: 4px solid;
      border-image: linear-gradient(45deg, #00ffcc, #ff00ff) 1;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      width: 850px;
      min-height: 450px;
    }

    .title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .title {
      color: #fff;
      font-size: 48px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff00ff;
      animation: flicker 3s infinite ease-in-out;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .title:hover {
      transform: scale(1.1);
    }

    .subtitle {
      color: #00ffcc;
      font-size: 20px;
      text-shadow: 0 0 5px #00ffcc;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .game-button {
      width: 340px;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      background: #000;
      border: 4px solid;
      border-image: linear-gradient(45deg, #00ffcc, #ff00ff) 1;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      text-align: center;
      animation: pulse 3s infinite ease-in-out;
    }

    .game-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ffcc, 0 0 15px #ff00ff;
    }

    .game-button.slope {
      border-image: linear-gradient(45deg, #00ff00, #00ffcc) 1;
    }

    .game-button.deathrun {
      border-image: linear-gradient(45deg, #ff0000, #ff00ff) 1;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .footer-text {
      color: #fff;
      font-size: 12px;
      font-style: italic;
      text-align: center;
      margin-top: 10px;
      z-index: 1001;
    }

    #game-container {
      display: none;
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }

    #game-container.active {
      display: block;
    }

    .game-embed {
      width: 100%;
      height: 100%;
      border: 4px solid;
      border-image: linear-gradient(45deg, #00ffcc, #ff00ff) 1;
      box-sizing: border-box;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      color: #fff;
      font-size: 14px;
      z-index: 1001;
    }
    
    .github-button {
      margin-left: auto; /* Pushes the button to the far right */
      margin-right: -13px; /* Adds spacing from the right edge */
      padding: 8px 16px;
      font-size: 14px;
      color: #fff;
      background: #000;
      border: 2px solid;
      border-image: linear-gradient(45deg, #00ffcc, #ff00ff) 1;
      border-radius: 2px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .github-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #00ffcc, 0 0 15px #ff00ff;
    }

    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #00ffcc;
      border-radius: 50%;
      opacity: 0.5;
      animation: float 15s linear infinite;
    }

    .particle:nth-child(1) { top: 10%; left: 20%; animation-duration: 20s; }
    .particle:nth-child(2) { top: 30%; left: 70%; animation-duration: 25s; }
    .particle:nth-child(3) { top: 50%; left: 10%; animation-duration: 18s; }
    .particle:nth-child(4) { top: 70%; left: 80%; animation-duration: 22s; }
    .particle:nth-child(5) { top: 20%; left: 50%; animation-duration: 17s; }
    .particle:nth-child(6) { top: 40%; left: 30%; animation-duration: 19s; }
    .particle:nth-child(7) { top: 60%; left: 60%; animation-duration: 23s; }
    .particle:nth-child(8) { top: 80%; left: 40%; animation-duration: 21s; }
    .particle:nth-child(9) { top: 15%; left: 85%; animation-duration: 24s; }
    .particle:nth-child(10) { top: 65%; left: 25%; animation-duration: 16s; }

    @keyframes float {
      0% { transform: translate(0, 0); opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { transform: translate(100px, 100px); opacity: 0.5; }
    }

    @media (max-width: 600px) {
      .content-wrapper {
        width: 550px;
        padding: 40px 60px;
        min-height: 350px;
      }

      .title {
        font-size: 36px;
      }

      .subtitle {
        font-size: 16px;
      }

      .game-button {
        width: 220px;
        font-size: 16px;
        padding: 12px;
      }

      .footer-text {
        font-size: 10px;
      }

      footer {
        font-size: 13px;
      }

      .github-button, .panic-button {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <a href="https://classroom.google.com" target="_blank" class="panic-button">Panic Button</a>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <div class="selection-screen" id="selectionScreen">
    <div class="content-wrapper">
      <div class="title-container">
        <div class="title">Slope & Death Run 3D</div>
        <div class="subtitle">On 3D Launcher</div>
      </div>
      <div class="button-container">
        <button class="game-button slope" onclick="loadGame('slope')">Slope</button>
        <button class="game-button deathrun" onclick="loadGame('deathrun')">Death Run 3D</button>
      </div>
    </div>
    <span class="footer-text">Coded by h_ac_k_z on Discord</span>
  </div>
  <div id="game-container">
    <iframe id="gameEmbed" class="game-embed" frameborder="0" allowfullscreen></iframe>
  </div>
  <footer>
    <span>© 2025 Slope & Death Run 3D Launcher</span>
    <a href="https://github.com/hackz00/3DLauncher" target="_blank" class="github-button">GitHub</a>
  </footer>

  <script>
    const games = {
      slope: 'https://3dcentral-slope.global.ssl.fastly.net/',
      deathrun: 'https://3dcentral-deathrun3d.global.ssl.fastly.net/'
    };

    function loadGame(game) {
      const selectionScreen = document.getElementById('selectionScreen');
      const gameContainer = document.getElementById('game-container');
      const gameEmbed = document.getElementById('gameEmbed');

      selectionScreen.classList.add('hidden');
      setTimeout(() => {
        gameEmbed.src = games[game];
        gameContainer.classList.add('active');
        toggleFullscreen();
      }, 500);
    }

    function toggleFullscreen() {
      const gameContainer = document.getElementById('game-container');
      if (gameContainer.requestFullscreen) {
        gameContainer.requestFullscreen().catch(err => console.log('Fullscreen blocked:', err));
      } else if (gameContainer.webkitRequestFullscreen) {
        gameContainer.webkitRequestFullscreen();
      } else if (gameContainer.msRequestFullscreen) {
        gameContainer.msRequestFullscreen();
      }
    }
  </script>
</body>
</html>
